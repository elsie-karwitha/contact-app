
services:
  # 1. Web Application
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: contact_db
      DB_USER: root
      DB_PASSWORD: secret_pass
    depends_on:
      - db

  # 2. MySQL Database
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret_pass
      MYSQL_DATABASE: contact_db
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 3. Mailpit Email Testing Service
  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  db_data:
